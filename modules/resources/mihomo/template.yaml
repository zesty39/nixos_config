  - { name: 香港|故转, <<: [*fall, *hk] }
  - { name: 狮城|故转, <<: [*fall, *sg] }
  - { name: 台湾|故转, <<: [*fall, *tw] }
  - { name: 美国|故转, <<: [*fall, *us] }
  - { name: 全部|故转, <<: [*fall, *all] }
  - { name: 日本|自动, <<: [*auto, *jp] }
  - { name: 香港|自动, <<: [*auto, *hk] }
  - { name: 狮城|自动, <<: [*auto, *sg] }
  - { name: 台湾|自动, <<: [*auto, *tw] }
  - { name: 美国|自动, <<: [*auto, *us] }
