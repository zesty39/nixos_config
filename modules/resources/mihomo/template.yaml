# Provider configuration
providers:
  &providers {
    type: http,
    interval: 0,
    health-check: { enable: true, url: https://www.gstatic.com/generate_204, interval: 300 },
    proxy: DIRECT,
  }
proxy-providers:
@PROVIDER_ENTRIES@

@PROVIDER_ANCHORS@

# Proxy configuration
proxies:
  - { name: LOCAL, type: direct }

# Global configuration
mixed-port: 7890
allow-lan: false
bind-address: "*"
lan-allowed-ips:
  - 127.0.0.1/32
  - 192.168.0.0/16
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# Dashboard configuration
external-controller: 127.0.0.1:9090
#secret: ""
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"

# Sniffer configuration
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "localhost"
  skip-src-address:
    - 127.0.0.1/32
  skip-dst-address:
    - 127.0.0.1/32

# Inbound configuration
tun:
  enable: true
  device: mihomo-tun0
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  strict-route: false
  auto-route: true
  auto-redirect: true
  auto-detect-interface: false
  interface-name: wlan0
  route-exclude-address:
    - 192.168.0.0/16
  route-exclude-address-set:
    - fakeipfilter_domain
    - cn_domain

# DNS configuration
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://8.8.8.8/dns-query#RULES&ecs=223.5.5.0/24
    - https://1.1.1.1/dns-query#RULES&ecs=223.5.5.0/24
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain,cn_domain"

# Proxy groups
group_default:
  &default {
    type: select,
    proxies:
      [
        日本|故转,
        香港|故转,
        狮城|故转,
        台湾|故转,
        美国|故转,
        全部|故转,
        日本|自动,
        香港|自动,
        狮城|自动,
        台湾|自动,
        美国|自动,
        全部|自动,
        @PROVIDER_GROUP_NAMES@,
        Direct,
      ],
  }
group_proxy:
  &proxy {
    type: select,
    proxies:
      [
        Proxy,
        日本|故转,
        香港|故转,
        狮城|故转,
        台湾|故转,
        美国|故转,
        全部|故转,
        日本|自动,
        香港|自动,
        狮城|自动,
        台湾|自动,
        美国|自动,
        全部|自动,
        @PROVIDER_GROUP_NAMES@,
        Direct,
      ],
  }
group_direct:
  &direct {
    type: select,
    proxies:
      [
        Direct,
        Proxy,
        日本|故转,
        香港|故转,
        狮城|故转,
        台湾|故转,
        美国|故转,
        全部|故转,
        日本|自动,
        香港|自动,
        狮城|自动,
        台湾|自动,
        美国|自动,
        全部|自动,
        @PROVIDER_GROUP_NAMES@,
      ],
  }
group_auto: &auto { type: url-test, tolerance: 30, <<: *@DEFAULT_PROVIDER_ANCHOR@, hidden: true }
group_fall: &fall { type: fallback, <<: *@DEFAULT_PROVIDER_ANCHOR@, hidden: true }
group_jp:
  &jp {
    filter: '(?i)🇯🇵|日本|\bJP\b|\bjapan\b',
    icon: "https://raw.githubusercontent.com/echs-top/proxy/09dca5e96bd6600520f532ba60c9d589e3f75e6c/img/flags/jp.svg",
  }
group_hk:
  &hk {
    filter: '(?i)🇭🇰|香港|\bHK\b|\bhongkong\b|\bhong\s?kong\b',
    icon: "https://raw.githubusercontent.com/echs-top/proxy/09dca5e96bd6600520f532ba60c9d589e3f75e6c/img/flags/hk.svg",
  }
group_sg:
  &sg {
    filter: '(?i)🇸🇬|新加坡|狮城|\bSG\b|\bsingapore\b',
    icon: "https://raw.githubusercontent.com/echs-top/proxy/09dca5e96bd6600520f532ba60c9d589e3f75e6c/img/flags/sg.svg",
  }
group_tw:
