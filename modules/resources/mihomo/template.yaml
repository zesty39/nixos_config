    filter: '(?i)🇹🇼|台湾|\bTW\b|\btaiwan\b',
    icon: "https://raw.githubusercontent.com/echs-top/proxy/09dca5e96bd6600520f532ba60c9d589e3f75e6c/img/flags/tw.svg",
  }
group_us:
  &us {
    filter: '(?i)🇺🇸|美国|\bUS\b|\bunitedstates\b|\bunited\s?states\b',
    icon: "https://raw.githubusercontent.com/echs-top/proxy/09dca5e96bd6600520f532ba60c9d589e3f75e6c/img/flags/us.svg",
  }
group_all:
  &all {
    filter: '(?i)🇯🇵|日本|\bJP\b|\bjapan\b|🇭🇰|香港|\bHK\b|\bhongkong\b|\bhong\s?kong\b|🇲🇴|澳门|\bMO\b|\bmacau\b|\bmacao\b|🇹🇼|台湾|\bTW\b|\btaiwan\b|🇸🇬|新加坡|狮城|\bSG\b|\bsingapore\b|🇺🇸|美国|\bUS\b|\bunitedstates\b|\bunited\s?states\b',
    icon: "https://raw.githubusercontent.com/echs-top/proxy/09dca5e96bd6600520f532ba60c9d589e3f75e6c/img/icon/Network_2.webp",
  }
proxy-groups:
  - {
      name: Direct,
      type: select,
      proxies: [LOCAL],
      url: "https://captive.apple.com/generate_204",
      hidden: true,
      icon: "https://raw.githubusercontent.com/echs-top/proxy/09dca5e96bd6600520f532ba60c9d589e3f75e6c/img/icon/DIRECT.webp",
